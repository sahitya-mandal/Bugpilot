databases:
  - name: bugpilot-db
    databaseName: bugpilot
    user: bugpilot
    plan: free

services:
  - type: web
    name: bugpilot-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bugpilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
