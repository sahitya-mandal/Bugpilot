spring.application.name=bugpilot-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/bugpilot
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

github.token=${GITHUB_TOKEN:}
github.api.url=${GITHUB_API_URL:https://api.github.com}
github.api.connect-timeout=${GITHUB_API_CONNECT_TIMEOUT:10000}
github.api.read-timeout=${GITHUB_API_READ_TIMEOUT:30000}
github.api.max-retries=${GITHUB_API_MAX_RETRIES:2}
github.api.retry-backoff-ms=${GITHUB_API_RETRY_BACKOFF_MS:500}

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.api.model=${GEMINI_API_MODEL:gemini-1.5-flash}
gemini.api.connect-timeout=${GEMINI_API_CONNECT_TIMEOUT:10000}
gemini.api.read-timeout=${GEMINI_API_READ_TIMEOUT:30000}

# Error Handling (SEC-05)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false